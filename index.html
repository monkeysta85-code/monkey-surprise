<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Little Surprise</title><style>:root{--cream:#fff8e9;--brown:#3c291c;--red:#e84444;--darkred:#a92e2e}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4ead8;font-family:Arial,sans-serif;color:#29211b}.card{width:min(460px,100%);text-align:center;background:var(--cream);border:3px solid var(--brown);border-radius:26px;padding:28px 20px;box-shadow:0 12px 35px #0002}.hearts{font-size:26px;letter-spacing:8px;color:var(--red)}.monkey{font-size:88px;margin:8px}.title{font-size:32px;font-weight:900}.subtitle{font-size:17px;margin:10px 0 22px}.btn{border:0;border-radius:999px;padding:15px 25px;background:var(--red);color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 var(--darkred)}.gift{display:none;margin-top:25px;padding:24px 12px;border-radius:20px;background:#fff;border:3px dashed var(--red)}.amount{font-size:52px;font-weight:900;color:#d62f2f;margin:7px 0}.message{font-size:18px;font-weight:700}.hint{font-size:13px;color:#705f52;margin-top:18px}</style></head><body><main class="card"><div class="hearts">♥ ♥ ♥</div><div class="monkey">🐵</div><div class="title">I Love You</div><div class="subtitle">I have a little surprise for you...</div><button id="openGift" class="btn" type="button">🎁 OPEN YOUR GIFT</button><section id="gift" class="gift" aria-live="polite"><div>🎉 ❤️ 🎊 ❤️ 🎉</div><div><strong>SURPRISE!</strong></div><div class="amount">₱10,000</div><div class="message">A little gift made especially for you ❤️</div></section><div class="hint">Tap the button to reveal your surprise.</div></main><script>const b=document.getElementById('openGift'),g=document.getElementById('gift');b.addEventListener('click',()=>{g.style.display='block';b.style.display='none'});</script></body></html>
